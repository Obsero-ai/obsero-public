version: 2
updates:
  # GitHub Actions used by CI and the Pages deploy.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  # Terraform providers, per module. There is no application dependency manifest
  # in this repo — obsero.mjs and both adapters are deliberately dependency-free.
  - package-ecosystem: terraform
    directories:
      - /aws/ingestion
      - /aws/site/terraform
      - /gcp/ingestion
      - /gcp/site/terraform
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "terraform"
    labels: ["dependencies", "terraform"]
    # Major provider versions are a deliberate, manual decision here: the
    # modules cap them on purpose (aws < 7.0, google < 8.0) because a major
    # bump can change resource schemas under a deployed pipeline. Without this,
    # Dependabot repeatedly tries the blocked major and the job fails with
    # "Content didn't change!". Raise the cap in versions.tf when you have
    # tested the new major, and this will start proposing patches again.
    ignore:
      - dependency-name: "hashicorp/google"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]

  # Base images for the Cloud Run adapter and the demo site container.
  - package-ecosystem: docker
    directories:
      - /gcp/ingestion/adapter
      - /gcp/site
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker"
    labels: ["dependencies", "docker"]
